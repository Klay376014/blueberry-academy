name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Not on main: the run that lands there ends in a deploy, and cancelling that
  # mid-upload leaves the site halfway between two versions. Superseding a
  # branch's checks is free; superseding an upload is not. The deploy job's own
  # group is what then keeps two main runs from uploading at once.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  node:
    name: check, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This action reads the `packageManager` field, which this repo does not
      # set — it pins devEngines.packageManager instead. The version therefore
      # lives in devEngines and in each setup step here, and they must move
      # together.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          # Has to satisfy engines.node — `^22.18.0 || >=24.12.0`.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not redundant: `vp check` type-checks with tsgolint, which cannot read
      # Vue SFCs, so vue-tsc is the type gate and the two see different files.
      - run: pnpm check
      - run: pnpm type-check

      - run: pnpm test:unit
      - run: pnpm build

  conventions:
    name: AGENTS.md 實作守則
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The script diffs two revisions and reads content out of one of them.
          fetch-depth: 0

      - id: range
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE_SHA"
          else
            # All-zeros on a branch's first push and after some force-pushes.
            base="$PUSH_BEFORE_SHA"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD^)
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}

      # GITHUB_SHA on a pull request is the merge commit, so the content checked
      # is what would land rather than what the branch holds in isolation.
      - run: sh scripts/check-conventions.sh "${{ steps.range.outputs.base }}" "$GITHUB_SHA"

  database:
    name: pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned, not `latest`: `latest` is the one path that asks the GitHub
      # releases API which version that is, and an unauthenticated ask from a
      # shared runner IP fails outright when the quota is gone -- measured on
      # #106, where the job died in 7s with `rate limit exceeded` and both
      # `supabase start` and `supabase test db` were skipped. A pin removes the
      # request rather than making it rarer, and stops CI silently tracking a
      # moving CLI. The token is the belt to that braces. See #107.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # supabase/.env is absent here, which is fine: without the Google
      # credentials the stack still starts and no test signs in through Google.
      - run: supabase start

      # What `pnpm db:test` runs. Called directly to keep the node toolchain out
      # of a job that only needs Postgres.
      - run: supabase test db

  deploy:
    name: deploy to Cloudflare
    needs: [node, conventions, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # One upload at a time. A second push waits rather than racing; GitHub drops
    # whichever pending deploy it superseded.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same script a human runs -- scripts/deploy.sh -- with the values
      # coming from secrets rather than from apps/web/.env.hosted.
      - run: pnpm run deploy
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
