packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  esbuild: true
  # Pulled in by @unovis/ts for its map components, which this app does not
  # use. Its build script only matters to those, so it stays unrun.
  maplibre-gl: false
  vue-demi: true

catalog:
  '@tsconfig/node24': ^24.0.4
  '@types/node': ^24.13.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
