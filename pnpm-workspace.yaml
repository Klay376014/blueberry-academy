packages:
  - 'apps/*'
  - 'packages/*'
  # Local maintenance scripts. A workspace package so its dependencies -- the
  # service_role client among them -- are declared where they are used and
  # cannot reach the app's bundle.
  - 'scripts'

allowBuilds:
  esbuild: true
  # Pulled in by @unovis/ts for its map components, which this app does not
  # use. Its build script only matters to those, so it stays unrun.
  maplibre-gl: false
  vue-demi: true
  # wrangler's local runtime. Only `wrangler dev` runs it -- `wrangler deploy`
  # uploads the bundle and never starts a worker locally -- but its build script
  # is what puts the platform binary in place, so leaving it unrun turns a local
  # preview into a confusing failure later.
  workerd: true

catalog:
  '@tsconfig/node24': ^24.0.4
  '@types/node': ^24.13.3
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
